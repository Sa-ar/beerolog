name: Neon branch sweep
# Keep only the default branch (production) + a small keep-list; delete every
# other Neon branch. The Vercel-Neon integration keeps creating preview/<branch>
# branches per deploy and there's no toggle we can reach, so sweep on a schedule
# to stay under the Neon branch quota. It never deletes production or a keep
# branch. Manual runs are a DRY-RUN unless you tick `apply`; scheduled runs
# always apply.
#
# Keep-list defaults to preview/staging,vercel-dev. Override with repo variable
# NEON_KEEP_BRANCHES (comma-separated). production is always kept (it's default).
on:
  schedule:
    - cron: '0 */6 * * *'  # every 6h
  workflow_dispatch:
    inputs:
      apply:
        description: actually delete (unticked = dry-run, list only)
        type: boolean
        default: false

permissions: {}

env:
  NEON_API: https://console.neon.tech/api/v2/projects/${{ vars.NEON_PROJECT_ID }}
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
  KEEP: ${{ vars.NEON_KEEP_BRANCHES || 'preview,preview/staging,vercel-dev' }}

jobs:
  sweep:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Sweep non-keep branches
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ inputs.apply }}" = true ]; then
            APPLY=1; else APPLY=0; fi
          branches=$(curl -fsS -H "Authorization: Bearer $NEON_API_KEY" "$NEON_API/branches")
          declare -A KEEPSET
          IFS=',' read -ra arr <<< "$KEEP"
          for k in "${arr[@]}"; do KEEPSET["$(echo "$k" | xargs)"]=1; done
          echo "keep: production(default) + ${!KEEPSET[*]}   (apply=$APPLY)"
          echo "$branches" | jq -r '.branches[] | "\(.id)\t\(.name)\t\(.default)"' |
          while IFS=$'\t' read -r id name isdefault; do
            if [ "$isdefault" = true ] || [ -n "${KEEPSET[$name]:-}" ]; then
              echo "keep          $name"; continue
            fi
            if [ "$APPLY" = 1 ]; then
              echo "delete        $name ($id)"
              curl -fsS -X DELETE -H "Authorization: Bearer $NEON_API_KEY" "$NEON_API/branches/$id" >/dev/null
            else
              echo "would-delete  $name ($id)"
            fi
          done
          echo "done"
