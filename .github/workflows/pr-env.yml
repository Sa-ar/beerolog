# Per-PR ephemeral environment: an isolated Neon DB branch wired into
# dedicated Vercel preview deploys for both the web and API projects.
#
# Single-build model (no wasted Vercel minutes): CI builds locally and ships
# with `vercel deploy --prebuilt`, so Vercel runs no remote build and the
# projects' "Ignored Build Step" only suppresses the git-triggered preview.
# Enable that suppression as the final cutover (see docs/ops/pr-env.md) AFTER
# this workflow is green on a throwaway PR.
#
# Needs: secrets NEON_API_KEY, VERCEL_TOKEN; vars NEON_PROJECT_ID,
# VERCEL_TEAM_ID, VERCEL_API_PROJECT_ID, VERCEL_WEB_PROJECT_ID.
name: PR ephemeral env

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# One run per PR; a new push cancels the in-flight provision.
concurrency:
  group: pr-env-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  GIT_BRANCH: ${{ github.event.pull_request.head.ref }}
  NEON_BRANCH: pr-${{ github.event.number }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}

jobs:
  provision:
    if: github.event.action != 'closed'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Create Neon branch (clones main's data, incl. seeded catalog)
        id: neon
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ env.NEON_BRANCH }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Apply pending migrations to the branch
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @beerolog/db db:migrate

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Deploy API preview (pinned to the PR's Neon branch)
        id: api
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_API_PROJECT_ID }}
          DB_URL_POOLED: ${{ steps.neon.outputs.db_url_pooled }}
        run: |
          ./.github/scripts/vercel-set-env.sh "$VERCEL_PROJECT_ID" DATABASE_URL "$DB_URL_POOLED" "$GIT_BRANCH"
          vercel pull --yes --environment=preview --git-branch="$GIT_BRANCH" --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "API preview: $url"

      - name: Deploy web preview (pointed at the API preview)
        id: web
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_WEB_PROJECT_ID }}
          API_URL: ${{ steps.api.outputs.url }}
        run: |
          ./.github/scripts/vercel-set-env.sh "$VERCEL_PROJECT_ID" VITE_API_URL "$API_URL" "$GIT_BRANCH"
          vercel pull --yes --environment=preview --git-branch="$GIT_BRANCH" --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          weburl=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" | tail -1)
          echo "url=$weburl" >> "$GITHUB_OUTPUT"
          echo "Web preview: $weburl"

      - name: Comment preview URLs on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '### Ephemeral preview ready',
              '',
              `- Web: ${{ steps.web.outputs.url }}`,
              `- API: ${{ steps.api.outputs.url }}`,
              `- Neon branch: \`${{ env.NEON_BRANCH }}\` (deleted on close)`,
            ].join('\n')
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            })

  teardown:
    if: github.event.action == 'closed'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Delete Neon branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_BRANCH }}
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Remove branch-scoped Vercel env vars
        run: |
          ./.github/scripts/vercel-rm-env.sh "${{ vars.VERCEL_API_PROJECT_ID }}" DATABASE_URL "$GIT_BRANCH"
          ./.github/scripts/vercel-rm-env.sh "${{ vars.VERCEL_WEB_PROJECT_ID }}" VITE_API_URL "$GIT_BRANCH"
