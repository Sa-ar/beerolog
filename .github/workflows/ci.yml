name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript:
    name: TypeScript (lint, typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint:js

      - name: Web unit + accessibility (axe) tests
        run: pnpm --dir apps/web test

  db-schema:
    name: Drizzle migration check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check migrations are up to date
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beerolog_test
        run: |
          pnpm --dir packages/db db:generate
          git diff --exit-code -- packages/db/migrations

  python:
    name: Python (lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - run: uv sync --extra dev

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      - run: uv run pytest tests/ -v
