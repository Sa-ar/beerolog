name: CI

on:
  push:
    branches: [main]
  # Run on every pull request, including stacked PRs whose base is not main,
  # so each PR in a stack is validated before it reaches main.
  pull_request:

jobs:
  typescript:
    name: TypeScript (lint, typecheck)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint:js

      - name: Web unit + accessibility (axe) tests
        run: pnpm --dir apps/web test

      # A real production build catches failures tsc does NOT (e.g. duplicate
      # `export function`, which esbuild rejects but tsc allows). Without this,
      # build-only breakage reaches main and fails the Vercel deploy.
      # See docs/ops/incidents/2026-07-28-ci-missing-build.md.
      - name: Web production build
        run: pnpm --dir apps/web build

  db-schema:
    name: Drizzle migration check
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check migrations are up to date
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beerolog_test
        run: |
          pnpm --dir packages/db db:generate
          git diff --exit-code -- packages/db/migrations

  python:
    name: Python (lint, test)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - run: uv sync --extra dev

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      - run: uv run pytest tests/ -v

      # Regression gate on ranking quality. Offline and deterministic: no
      # database, no API key. The floor sits just under the current aggregate,
      # so a change that degrades ranking fails here rather than in production.
      - name: Persona harness
        run: uv run python tests/eval/run_personas.py --floor 0.5
