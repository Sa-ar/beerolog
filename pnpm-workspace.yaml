packages:
  - 'apps/*'
  - 'packages/*'

# Pin Clerk to the generation the app's auth code (@clerk/tanstack-react-start@1.3.1)
# is written for. @clerk/testing pulls newer ranges that float @clerk/shared to
# 4.20 and break signin/signup types; these are within @clerk/testing@2.0.5's
# supported ranges (shared ^4.3.1, backend ^3.2.1).
overrides:
  '@clerk/shared': '4.13.1'
  '@clerk/backend': '3.4.13'
  '@clerk/react': '6.7.1'

allowBuilds:
  '@clerk/shared': true
  '@parcel/watcher': true
  esbuild: true
  # @vercel/og renders via resvg-wasm, so sharp's native build is not needed.
  sharp: false

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
