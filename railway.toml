# API service — deploy from repo root so `packages/icon-service` is in the build context.
# In Railway: clear Source → Root directory (leave blank). Do not set it to `apps/api`.
$schema = "https://railway.com/railway.schema.json"

[build]
buildCommand = "uv sync --frozen --no-dev --directory apps/api"
watchPatterns = ["apps/api/**", "packages/icon-service/**"]

[deploy]
startCommand = "uv --directory apps/api run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
